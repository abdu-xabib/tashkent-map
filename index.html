<!DOCTYPE html>
<html>
<head>
    <title>Карта Заведений</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        body { padding: 0; margin: 0; background-color: #f0f0f0; }
        /* 100vh гарантирует, что карта займет всю высоту экрана Телеграма */
        html, body, #map { height: 100vh; width: 100vw; overflow: hidden; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand(); 

        var map = L.map('map').setView([41.2995, 69.2401], 12);
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap, © CARTO',
            maxZoom: 19
        }).addTo(map);

        // === НОВАЯ ФИШКА: ИЩЕМ ПОЛЬЗОВАТЕЛЯ (GPS) ===
        // Просим карту найти пользователя (setView: false - чтобы не дергать экран резко)
        map.locate({setView: false, maxZoom: 16});

        // Когда телефон дал координаты, рисуем синюю точку
        map.on('locationfound', function(e) {
            // Синяя точка
            L.circleMarker(e.latlng, {
                radius: 8,
                fillColor: "#0078ff", // Красивый синий цвет
                color: "#ffffff",     // Белая обводка
                weight: 3,
                opacity: 1,
                fillOpacity: 1
            }).addTo(map).bindPopup("<b>📍 Вы находитесь здесь!</b>");

            // Полупрозрачный круг (показывает точность GPS)
            L.circle(e.latlng, e.accuracy / 2, {
                color: '#0078ff',
                fillColor: '#0078ff',
                fillOpacity: 0.15,
                weight: 1
            }).addTo(map);
        });

        // Если юзер не дал доступ к GPS, просто игнорируем
        map.on('locationerror', function(e) {
            console.log("Доступ к локации запрещен или недоступен.");
        });
        // ============================================

        // 1. Читаем "хвостик" из ссылки с ресторанами
        var urlParams = new URLSearchParams(window.location.search);
        var dataParam = urlParams.get('d');

        if (dataParam) {
            // 2. Если данные есть, разбиваем их по символу "|"
            var places = dataParam.split('|');
            
            places.forEach(function(place) {
                var parts = place.split(',');
                if (parts.length >= 4) {
                    var id = parts[0];
                    var lat = parseFloat(parts[1]);
                    var lon = parseFloat(parts[2]);
                    var name = parts.slice(3).join(','); // Берем название

                    // Ставим маркеры ресторанов
                    var marker = L.marker([lat, lon]).addTo(map);
                    marker.bindPopup("<b>🍔 " + name + "</b>");
                }
            });
        }
    </script>
</body>
</html>
