<!DOCTYPE html>
<html>
<head>
    <title>Карта Заведений</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        body { padding: 0; margin: 0; background-color: #f0f0f0; }
        /* 100vh гарантирует, что карта займет всю высоту экрана Телеграма */
        html, body, #map { height: 100vh; width: 100vw; overflow: hidden; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand(); 

        var map = L.map('map').setView([41.2995, 69.2401], 12);
        
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap, © CARTO',
            maxZoom: 19
        }).addTo(map);

        // 1. Читаем "хвостик" из ссылки
        var urlParams = new URLSearchParams(window.location.search);
        var dataParam = urlParams.get('d');

        if (dataParam) {
            // 2. Если данные есть, разбиваем их по символу "|" (получаем список мест)
            var places = dataParam.split('|');
            
            places.forEach(function(place) {
                // Разделяем id, lat, lon и название
                var parts = place.split(',');
                if (parts.length >= 4) {
                    var id = parts[0];
                    var lat = parseFloat(parts[1]);
                    var lon = parseFloat(parts[2]);
                    var name = parts.slice(3).join(','); // Берем название

                    // Ставим маркер на карту
                    var marker = L.marker([lat, lon]).addTo(map);
                    marker.bindPopup("<b>" + name + "</b>");
                }
            });
        } else {
            // Если данных нет, показываем тестовую точку
            var marker = L.marker([41.2995, 69.2401]).addTo(map);
            marker.bindPopup("<b>Привет, Ташкент!</b><br>Жду данные из базы...").openPopup();
        }
    </script>
</body>
</html>
