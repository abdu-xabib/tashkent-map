<!DOCTYPE html>
<html>
<head>
    <title>Карта Заведений</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        body { padding: 0; margin: 0; background-color: #f0f0f0; }
        /* 100vh гарантирует, что карта займет всю высоту экрана Телеграма */
        html, body, #map { height: 100vh; width: 100vw; overflow: hidden; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // Сообщаем Телеграму, что приложение готово и его можно показывать
        window.Telegram.WebApp.ready();
        // Автоматически растягиваем окно на весь экран телефона
        window.Telegram.WebApp.expand(); 

        // Создаем карту
        var map = L.map('map').setView([41.2995, 69.2401], 12);
        // Загружаем карту в ВЫСОКОМ качестве для мобильных телефонов
        // Подключаем премиум-дизайн карты (CARTO Voyager), он решает проблему со шрифтами
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap, © CARTO',
            maxZoom: 19
        }).addTo(map);

        var marker = L.marker([41.2995, 69.2401]).addTo(map);
        marker.bindPopup("<b>Привет, Ташкент!</b><br>Здесь скоро будут наши рестораны.").openPopup();
    </script>
</body>
</html>
